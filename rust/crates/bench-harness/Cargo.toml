[package]
name = "bench-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tsc-bench"
path = "src/main.rs"

[lints]
workspace = true

[features]
mimalloc = ["dep:mimalloc"]

[dependencies]
# Allocator hardening lever (BENCHMARKS.md Phase B findings, 2026-10-09/10):
# the program/bind phases are allocation-heavy and glibc malloc trails Go's
# tcmalloc-class allocator. Enabled ONLY for the bench binary — the port
# crates stay allocator-agnostic. Off by default; the official default-build
# numbers use the system allocator.
mimalloc = { version = "0.1", optional = true }
tsc-tspath = { path = "../tspath" }
tsc-jsnum = { path = "../jsnum" }
tsc-core = { path = "../core" }
tsc-ast = { path = "../ast" }
tsc-parser = { path = "../parser" }
tsc-binder = { path = "../binder" }
tsc-vfs = { path = "../vfs" }
tsc-module = { path = "../module" }
tsc-tsoptions = { path = "../tsoptions" }
tsc-compiler = { path = "../compiler" }
tsc-bundled = { path = "../bundled" }
tsc-testrunner = { path = "../tsc-testrunner" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
