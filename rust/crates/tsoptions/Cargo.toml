[package]
name = "tsc-tsoptions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rustc-hash = { workspace = true }

serde_json = { workspace = true }

tsc-ast = { path = "../ast" }
tsc-collections = { path = "../collections" }
tsc-contentmapper = { path = "../contentmapper" }
tsc-core = { path = "../core" }
tsc-diagnostics = { path = "../diagnostics" }
tsc-glob = { path = "../glob" }
# Go's convertPropertyValueToJson calls jsnum.FromString for numeric literals
# (the M6 config-file route's AST→value conversion).
tsc-jsnum = { path = "../jsnum" }
tsc-json = { path = "../json" }
tsc-locale = { path = "../locale" }
# Go's parsedcommandline.go calls outputpaths.GetBuildInfoFileName
# (ParsedCommandLine.GetBuildInfoFileName — the M6 verifyCompilerOptions wave).
tsc-outputpaths = { path = "../outputpaths" }
# Go's tsconfigparsing parses the config text as a JSON SourceFile through
# the parser package (NewTsconfigSourceFileFromFilePath — the M6 config-node
# diagnostic surface).
tsc-parser = { path = "../parser" }
# Go's tsconfigparsing imports tsc/internal/module (module-specifier extends
# + the getFileNamesFromConfigSpecs file enumeration, which uses the module
# crate's in-crate vfsmatch port: ReadDirectory + SpecMatcher).
tsc-module = { path = "../module" }
tsc-scanner = { path = "../scanner" }
tsc-stringutil = { path = "../stringutil" }
tsc-tspath = { path = "../tspath" }
tsc-vfs = { path = "../vfs" }
